<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f6f1e7'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%237a2e1f' font-family='serif'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--ink:#1a1612;--ink2:#6a5f54;--line:rgba(26,22,18,.14);
--accent:#7a2e1f;--muted:#b9a996;--serif:'Instrument Serif',Georgia,serif;--sans:'Geist',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:18px}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;
-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:0 32px 120px}
.mast{padding:48px 0 24px;border-bottom:2px solid var(--ink);display:flex;
justify-content:space-between;align-items:baseline;gap:16px}
.mast .name{font-family:var(--serif);font-size:2.6rem;line-height:1;letter-spacing:-.01em}
.mast .meta{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.hero{padding:64px 0 40px;border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--serif);font-size:clamp(2.4rem,6vw,3.6rem);font-weight:400;
line-height:1.05;max-width:18ch}
.hero p{margin-top:20px;font-size:1.05rem;line-height:1.7;color:var(--ink2);max-width:52ch}
.hero p strong{color:var(--ink);font-weight:500}
.stats{margin-top:28px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.stats span{margin-right:24px}
.toc{margin-top:48px}
.toc h2{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);
margin-bottom:16px}
.entry{display:grid;grid-template-columns:48px 1fr auto;gap:20px;align-items:baseline;
padding:20px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.entry:hover .title{color:var(--accent)}
.entry .idx{font-family:var(--serif);font-size:1.1rem;color:var(--muted)}
.entry .title{font-family:var(--serif);font-size:1.5rem;font-weight:400;line-height:1.2}
.entry .by{font-size:.85rem;color:var(--ink2);margin-top:4px}
.entry .right{text-align:right;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.entry .right .marks{display:block;color:var(--accent);margin-top:2px}
.foot{margin-top:80px;padding-top:24px;border-top:1px solid var(--line);
display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
font-size:.78rem;letter-spacing:.06em;color:var(--ink2)}
.foot a{color:var(--accent);text-decoration:none}
#rr-search{display:none;position:fixed;inset:0;z-index:50;background:rgba(26,22,18,.45)}
#rr-search.open{display:block}
#rr-search-box{max-width:520px;margin:14vh auto 0;background:var(--bg);
border:1px solid var(--ink);padding:20px}
#rr-search-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
color:var(--ink);font:inherit;font-size:1rem;padding:8px 0;outline:none}
#rr-search-input:focus{border-color:var(--accent)}
#rr-search-list{margin-top:12px;font-size:.9rem}
#rr-search-list a{display:block;color:var(--ink);text-decoration:none;padding:8px 0;
border-bottom:1px solid var(--line)}
#rr-search-list a:hover{color:var(--accent)}
@media (max-width:640px){.wrap{padding:0 20px 80px}.entry{grid-template-columns:36px 1fr}.entry .right{display:none}.mast .name{font-size:2rem}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="name">Article Room</div>
    <div class="meta"><span id="rr-streak"></span> &nbsp; <a href="#" id="rr-search-btn" style="color:inherit;text-decoration:none">search</a> &nbsp; <a href="settings.html" style="color:inherit;text-decoration:none">settings</a></div>
  </header>
  <div id="rr-search" role="dialog" aria-label="Search the library"><div id="rr-search-box"><input id="rr-search-input" type="text" placeholder="Search books, guides, blogs…" autocomplete="off"><div id="rr-search-list"></div></div></div>
  <section class="hero">
    <h1>Articles I have read, marked up, and kept.</h1>
  </section>
  <section class="toc">
    <h2>Index</h2>
    <a class="row" href="books/agentic-search-vs-vector-search/full_reader.html"><span class="n">02</span><span><span class="title">Agentic Search vs Vector Search for Coding Agents</span><span class="sub">Braintrust &middot; 0 marks</span></span><span class="tag">read</span></a><a class="row" href="books/writing/part01_reader.html"><span class="n">03</span><span><span class="title">Why Is AI Bad at Writing?</span><span class="sub">James Wang &middot; 17 marks</span></span><span class="tag">read</span></a>
  </section>
  <footer class="foot"><span>text: authors and publications</span><span><a href="https://github.com/Arun2565/article-room">source</a></span></footer>
</div>
<script src="assets/local.js?v=2"></script>
<script src="assets/library.js?v=2"></script>
</body>
</html>
